      <script>
  (function () {
    const form  = document.getElementById('testeForm');
    const email = document.getElementById('email');
    const btn   = document.querySelector('.btn-submit');
    const btnHTML = btn.innerHTML;

    // Sem .co no JS (o pattern do input já bloqueia)
    const blockedExactDomains = new Set([]); // deixe vazio para não duplicar
    const blockedSuffixDomains = [
      'mailinator.com','tempmail.com','10minutemail.com','yopmail.com',
      'guerrillamail.com','dispostable.com','sharklasers.com','getnada.com',
      'dropmail.me','trashmail.com','fakeinbox.com'
    ];
    const blockedTlds = new Set([]); // vazio (pattern já trata .co)

    function setLoading(on){
      if(on){ btn.classList.add('loading'); btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Gerando teste...'; }
      else  { btn.classList.remove('loading'); btn.disabled = false; btn.innerHTML = btnHTML; }
    }

    function needsGenericBlock(value){
      const v = (value || '').trim().toLowerCase();
      if (!v) return false;
      if (/\s/.test(v)) return true;               // espaços
      // Se quiser permitir unicode no local-part, remova a linha abaixo
      if (/[^ -~]/.test(v)) return true;           // unicode no e-mail
      const parts = v.split('@');
      if (parts.length !== 2) return false;        // deixa HTML5 tratar
      const [local, domain] = parts;
      if (!domain) return true;
      if (/\.\./.test(v)) return true;             // pontos duplos
      if (domain.startsWith('-') || domain.endsWith('-')) return true;
      if (local.startsWith('.') || local.endsWith('.')) return true;
      const tld = domain.split('.').pop() || '';
      if (blockedTlds.has(tld)) return true;       // atualmente nenhum
      if (blockedExactDomains.has(domain)) return true;
      for (const bad of blockedSuffixDomains){
        if (domain.endsWith(bad)) return true;
      }
      return false;
    }

    form.addEventListener('submit', function(e){
      email.setCustomValidity('');

      // 1) Regras extras genéricas (descartáveis, etc.)
      if (needsGenericBlock(email.value)) {
        e.preventDefault();
        email.setCustomValidity('Dados inválidos');
        email.reportValidity();
        setLoading(false);
        return;
      }

      // 2) Regras nativas HTML5 (type/required/pattern do input)
      if (!email.checkValidity()) {
        e.preventDefault();
        email.reportValidity(); // balão nativo
        setLoading(false);
        return;
      }

      setLoading(true);
    });

    email.addEventListener('input', function(){
      email.setCustomValidity('');
      setLoading(false);
    });
  })();
</script>
